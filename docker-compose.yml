services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev_pw}
      POSTGRES_DB: crm_dev
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD:-crm_dev_pw}@postgres:5432/crm_dev?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-troque_este_segredo_de_acesso}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-troque_este_segredo_de_refresh}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3333
      CORS_ORIGIN: "*"
      # Usado para montar o link público que o fornecedor recebe por
      # WhatsApp/e-mail (preencher cotação / confirmar ordem de compra).
      # Troque para a URL real do seu CRM em produção (ex.: https://crm.suaempresa.com.br).
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
    volumes:
      # Sem isso, arquivos enviados pelo usuário (logo da empresa, fotos de
      # produto) ficam só no filesystem do container e somem a cada
      # `docker compose up -d --build` — bug real encontrado nesta varredura.
      - crm_uploads:/repo/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  crm_pgdata:
  crm_uploads:
