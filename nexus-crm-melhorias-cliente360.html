<title>Nexus CRM — Cliente 360º conectado</title>
<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --border: #e2e8f0; --text: #0f172a; --text-muted: #64748b;
    --accent: #7c3aed; --accent-soft: #f5f3ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0f19; --panel: #131a2a; --border: #232d42; --text: #e5e9f0; --text-muted: #93a0b8;
      --accent: #a78bfa; --accent-soft: #1f1a3d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0f19; --panel: #131a2a; --border: #232d42; --text: #e5e9f0; --text-muted: #93a0b8;
    --accent: #a78bfa; --accent-soft: #1f1a3d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 280px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); padding: 20px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 0 10px 16px; }
  .brand-badge { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  .brand-name { font-weight: 700; font-size: 14.5px; }
  .sidebar-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); padding: 6px 10px 10px; }
  .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; color: var(--text); padding: 10px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; margin-bottom: 2px; }
  .nav-item:hover { background: var(--accent-soft); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-num { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--text-muted); width: 18px; }
  .nav-item.active .nav-num { color: var(--accent); }
  .main { flex: 1; padding: 28px 40px; max-width: 1160px; }
  .header { margin-bottom: 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
  .header h1 { font-size: 20px; margin: 0 0 4px; }
  .header p { margin: 0; color: var(--text-muted); font-size: 14px; max-width: 640px; }
  .frame { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .frame-bar { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
  .frame img { display: block; width: 100%; height: auto; }
  .thumbs { display: flex; gap: 10px; overflow-x: auto; margin-top: 20px; padding-bottom: 8px; }
  .thumb { flex-shrink: 0; width: 130px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; background: var(--panel); }
  .thumb.active { border-color: var(--accent); }
  .thumb img { width: 100%; display: block; }
  .thumb-label { font-size: 10.5px; padding: 4px 6px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-arrows { display: flex; gap: 8px; flex-shrink: 0; }
  .arrow-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .arrow-btn:hover { background: var(--accent-soft); }
</style>

  let current = 0;
  function render() {
    document.getElementById('title').textContent = DATA[current].label;
    document.getElementById('desc').textContent = DATA[current].desc;
    document.getElementById('main-img').src = DATA[current].src;
    document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', i === current));
    document.querySelectorAll('.thumb').forEach((el, i) => el.classList.toggle('active', i === current));
    const activeThumb = document.querySelectorAll('.thumb')[current];
    if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }
  function goTo(i) { current = ((i % DATA.length) + DATA.length) % DATA.length; render(); }
  document.querySelectorAll('.nav-item').forEach((el, i) => el.addEventListener('click', () => goTo(i)));
  document.getElementById('prev-btn').addEventListener('click', () => goTo(current - 1));
  document.getElementById('next-btn').addEventListener('click', () => goTo(current + 1));
  const thumbsEl = document.getElementById('thumbs');
  DATA.forEach((d, i) => {
    const t = document.createElement('div');
    t.className = 'thumb';
    t.innerHTML = '<img src="' + d.src + '" alt="" /><div class="thumb-label">' + d.label + '</div>';
    t.addEventListener('click', () => goTo(i));
    thumbsEl.appendChild(t);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') goTo(current + 1); if (e.key === 'ArrowLeft') goTo(current - 1); });
  render();
</script>
